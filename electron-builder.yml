appId: com.zjj.localdeploy
productName: LocalDeploy
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
extraResources:
  - from: resources/mkcert/mkcert.exe
    to: mkcert/mkcert.exe
win:
  target:
    - portable
    - nsis
  artifactName: ${productName}-${version}-${os}-${arch}.${ext}
portable:
  artifactName: ${productName}-${version}-portable.${ext}
nsis:
  artifactName: ${productName}-${version}-setup.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
npmRebuild: false
